<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#grad1)"/>

  <!-- Video play symbol -->
  <rect x="35" y="30" width="58" height="42" rx="4" fill="white" opacity="0.9"/>
  <polygon points="52,44 52,58 64,51" fill="#667eea"/>

  <!-- Download arrow -->
  <g transform="translate(64, 75)">
    <line x1="0" y1="0" x2="0" y2="20" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <polyline points="-8,12 0,20 8,12" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="-12" y1="24" x2="12" y2="24" stroke="white" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
