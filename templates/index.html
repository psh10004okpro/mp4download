<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>동영상 다운로더</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 800px;
            width: 100%;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        input[type="text"] {
            flex: 1;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: bold;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            text-align: center;
            margin: 20px 0;
            display: none;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .video-info {
            display: none;
            margin-top: 30px;
        }

        .video-preview {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .video-preview img {
            width: 200px;
            height: auto;
            border-radius: 10px;
        }

        .video-details {
            flex: 1;
        }

        .video-details h3 {
            color: #333;
            margin-bottom: 10px;
        }

        .video-details p {
            color: #666;
            margin-bottom: 5px;
        }

        .formats {
            margin-top: 20px;
        }

        .format-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 10px;
            transition: background 0.2s;
        }

        .format-item:hover {
            background: #e9ecef;
        }

        .format-info {
            flex: 1;
        }

        .format-info strong {
            color: #333;
        }

        .format-info span {
            color: #666;
            font-size: 0.9em;
        }

        .download-btn {
            padding: 10px 20px;
            font-size: 14px;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }

        .success {
            background: #efe;
            color: #3c3;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }

        .status {
            margin-top: 20px;
            text-align: center;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎥 동영상 다운로더</h1>

        <div class="input-group">
            <input type="text" id="videoUrl" placeholder="동영상 URL을 입력하세요 (YouTube, Vimeo, 등)" />
            <button id="searchBtn" onclick="searchVideo()">검색</button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>동영상 정보를 가져오는 중...</p>
        </div>

        <div class="error" id="error"></div>
        <div class="success" id="success"></div>

        <div class="video-info" id="videoInfo">
            <div class="video-preview">
                <img id="thumbnail" src="" alt="썸네일" />
                <div class="video-details">
                    <h3 id="title"></h3>
                    <p><strong>업로더:</strong> <span id="uploader"></span></p>
                    <p><strong>길이:</strong> <span id="duration"></span></p>
                </div>
            </div>

            <div class="formats">
                <h3>다운로드 가능한 포맷:</h3>
                <div id="formatsList"></div>
            </div>
        </div>

        <div class="status" id="status"></div>
    </div>

    <script>
        let currentUrl = '';
        let videoFormats = [];

        function showError(message) {
            const errorEl = document.getElementById('error');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
            setTimeout(() => {
                errorEl.style.display = 'none';
            }, 5000);
        }

        function showSuccess(message) {
            const successEl = document.getElementById('success');
            successEl.textContent = message;
            successEl.style.display = 'block';
            setTimeout(() => {
                successEl.style.display = 'none';
            }, 5000);
        }

        function formatDuration(seconds) {
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = Math.floor(seconds % 60);

            if (hours > 0) {
                return `${hours}:${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }
            return `${minutes}:${secs.toString().padStart(2, '0')}`;
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '크기 정보 없음';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round((bytes / Math.pow(k, i)) * 100) / 100 + ' ' + sizes[i];
        }

        async function searchVideo() {
            const url = document.getElementById('videoUrl').value.trim();

            if (!url) {
                showError('URL을 입력해주세요');
                return;
            }

            currentUrl = url;

            // UI 초기화
            document.getElementById('loading').style.display = 'block';
            document.getElementById('videoInfo').style.display = 'none';
            document.getElementById('searchBtn').disabled = true;

            try {
                const response = await fetch('/api/video-info', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ url }),
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || '동영상 정보를 가져올 수 없습니다');
                }

                // 동영상 정보 표시
                document.getElementById('thumbnail').src = data.thumbnail;
                document.getElementById('title').textContent = data.title;
                document.getElementById('uploader').textContent = data.uploader;
                document.getElementById('duration').textContent = formatDuration(data.duration);

                // 포맷 목록 생성
                videoFormats = data.formats;
                displayFormats(data.formats);

                document.getElementById('videoInfo').style.display = 'block';

            } catch (error) {
                showError(error.message);
            } finally {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('searchBtn').disabled = false;
            }
        }

        function displayFormats(formats) {
            const formatsList = document.getElementById('formatsList');
            formatsList.innerHTML = '';

            // 비디오+오디오 포맷만 필터링하고 정렬
            const videoFormats = formats.filter(f => f.vcodec !== 'none' && f.acodec !== 'none');

            // 해상도별로 정렬
            videoFormats.sort((a, b) => {
                const getHeight = (resolution) => {
                    const match = resolution.match(/\d+/);
                    return match ? parseInt(match[0]) : 0;
                };
                return getHeight(b.resolution) - getHeight(a.resolution);
            });

            if (videoFormats.length === 0) {
                formatsList.innerHTML = '<p>사용 가능한 포맷이 없습니다. "최고 품질" 다운로드를 시도해주세요.</p>';
            }

            // "최고 품질" 옵션 추가
            const bestFormat = document.createElement('div');
            bestFormat.className = 'format-item';
            bestFormat.innerHTML = `
                <div class="format-info">
                    <strong>최고 품질</strong><br>
                    <span>최고 품질의 비디오와 오디오</span>
                </div>
                <button class="download-btn" onclick="downloadVideo('best')">다운로드</button>
            `;
            formatsList.appendChild(bestFormat);

            // 각 포맷 항목 생성
            videoFormats.forEach(format => {
                const formatItem = document.createElement('div');
                formatItem.className = 'format-item';

                formatItem.innerHTML = `
                    <div class="format-info">
                        <strong>${format.resolution}</strong> (${format.ext})<br>
                        <span>${format.format_note} - ${formatFileSize(format.filesize)}</span>
                    </div>
                    <button class="download-btn" onclick="downloadVideo('${format.format_id}')">다운로드</button>
                `;

                formatsList.appendChild(formatItem);
            });
        }

        async function downloadVideo(formatId) {
            const statusEl = document.getElementById('status');
            statusEl.textContent = '다운로드 중... 잠시만 기다려주세요.';

            try {
                const response = await fetch('/api/download', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        url: currentUrl,
                        format_id: formatId
                    }),
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || '다운로드에 실패했습니다');
                }

                showSuccess('다운로드가 완료되었습니다!');
                statusEl.textContent = '';

                // 파일 다운로드
                window.location.href = data.download_url;

            } catch (error) {
                showError(error.message);
                statusEl.textContent = '';
            }
        }

        // Enter 키로 검색
        document.getElementById('videoUrl').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchVideo();
            }
        });
    </script>
</body>
</html>
